services:
  weaviate:
    image: semitechnologies/weaviate:1.34.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:15051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: text2vec-model2vec
      ENABLE_MODULES: text2vec-model2vec
      MODEL2VEC_INFERENCE_API: http://text2vec-model2vec:8080
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: ai-business-research
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - text2vec-model2vec

  text2vec-model2vec:
    image: cr.weaviate.io/semitechnologies/model2vec-inference:${MODEL2VEC_IMAGE_TAG:-minishlab-potion-base-8M}

volumes:
  weaviate_data:
