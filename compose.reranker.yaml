services:
  weaviate:
    environment:
      ENABLE_MODULES: text2vec-model2vec,reranker-transformers
      RERANKER_INFERENCE_API: http://reranker-transformers:8080
    depends_on:
      - text2vec-model2vec
      - reranker-transformers

  reranker-transformers:
    build:
      context: ./infra/weaviate_reranker
      args:
        MODEL_NAME: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    image: ai-business-research-reranker:cpu
    environment:
      ENABLE_CUDA: "0"
